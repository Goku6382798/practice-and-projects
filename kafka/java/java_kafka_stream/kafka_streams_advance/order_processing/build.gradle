plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.thecodinginterface'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
	maven {
		url 'https://packages.confluent.io/maven'
	}
	flatDir {
		dirs 'src/main/libs'
	}
}

dependencies {
	implementation "org.apache.avro:avro:1.11.0"

	// Kafka Core
	implementation 'org.apache.kafka:kafka-clients:3.7.0'
	implementation 'org.apache.kafka:kafka-streams:3.7.0'

	// Confluent Schema Registry + Serde
	implementation 'io.confluent:kafka-avro-serializer:7.6.0'
	implementation 'io.confluent:kafka-streams-avro-serde:7.6.0'
	implementation 'io.confluent:kafka-schema-registry-client:7.6.0'

	// Spring Boot + Kafka (Includes Kafka Streams support)
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.kafka:spring-kafka'

	// Custom Avro JAR
	implementation files("src/main/libs/order-domain-events-0.2.0.jar")

	// Testing
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.kafka:spring-kafka-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('bootBuildImage') {
	builder = 'paketobuildpacks/builder-jammy-base:latest'
}

tasks.named('test') {
	useJUnitPlatform()
}
