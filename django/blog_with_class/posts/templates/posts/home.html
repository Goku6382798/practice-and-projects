<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
        {% for post in posts%}
            <a href="/post/{{post.id}}"><h1>{{forloop.counter}} - {{post.title}}</h1></a>
            <p>{{post.content}}</p>
        {% empty %}
            <h1>No Posts Available</h1>
        {% endfor %}
    
</body>
</html>
