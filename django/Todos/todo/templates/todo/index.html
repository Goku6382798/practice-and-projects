<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo Home</title>
    <style>
        .btn{
            padding: 8px 12px;
            background-color: aqua;
            border: 2px solid green;
            color: black;
        }
    </style>
</head>
<body>
    <ul>
        {% for todo in todos %}
            <a href="{% url "todo" todo.id %}">
                <li>{{ todo.todo }}</li>
            </a>
            <br>
            <a class ='btn' href="{% url 'up' todo.id %}"> Update </a>
            <a class ='btn' href="{% url 'delete' todo.id %}">Delete</a>
            </br>
        {% endfor %}
    </ul>
</body>
</html>
