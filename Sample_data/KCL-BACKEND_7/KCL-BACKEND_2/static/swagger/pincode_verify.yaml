openapi: 3.0.3
info:
  title: PINCODE VERIFY API
  version: "1.0"
paths:
  /api/pincode_verify:
    post:
      summary: Verify Pincode Type
      description: |
        Validates a 6-digit Indian pincode and determines whether the user is eligible (rural).
        JWT is optional.
      security: []
      tags:
        - Pincode

      parameters:
        - in: header
          name: languageCode
          required: false
          schema:
            type: string
          example: "en"
          description: "Language code for translated messages. Defaults to 'en'."

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - pincode
              properties:
                pincode:
                  type: string
                  example: "458888"
                  description: "6-digit Indian postal code to verify."

      responses:
        "200":
          description: Pincode verification result
          content:
            application/json:
              examples:
                eligible:
                  value:
                    statusCode: 200
                    message: "Yes, you are eligible."
                    isfromrural: true
                    response: {}
                not_eligible:
                  value:
                    statusCode: 200
                    message: "Sorry, you are not eligible."
                    isfromrural: false
                    response: {}
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                  message:
                    type: string
                  isfromrural:
                    type: boolean
                  response:
                    type: object

        "400":
          description: Invalid or missing pincode
          content:
            application/json:
              examples:
                missing_pincode:
                  value:
                    statusCode: 400
                    message: "Pincode is required"
                    response: {}
                invalid_format:
                  value:
                    statusCode: 400
                    message: "Pincode must be 6 digits and cannot start with 0"
                    response: {}
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                  message:
                    type: string
                  response:
                    type: object

        "500":
          description: Internal server error
          content:
            application/json:
              example:
                statusCode: 500
                message: "Internal server error"
                response: {}
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                  message:
                    type: string
                  response:
                    type: object