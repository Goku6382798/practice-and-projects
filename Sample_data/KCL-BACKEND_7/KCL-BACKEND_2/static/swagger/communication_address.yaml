openapi: 3.0.3
info:
  title: Communication Address API
  version: "1.0"

paths:
  /api/communication_address:
    post:
      tags:
        - User Communication Address
      summary: Add or update communication address
      description: |
        Updates the user's `communicationaddress` and sets `isCommunicationaddressadded = true`.

        Two modes are supported based on `useExistingAddress` in the request body:

        1. `useExistingAddress = true`  
           - Copies the existing `address` field from `user_master` into `communicationaddress`.

        2. `useExistingAddress = false`  
           - Uses the provided address fields in the request body to create / update `communicationaddress`.

      security: [ ]  # No JWT required here
      parameters:
        - in: header
          name: userid
          required: true
          schema:
            type: string
            example: "804881"
          description: User ID of the logged-in user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - useExistingAddress
              properties:
                useExistingAddress:
                  type: boolean
                  description: |
                    true  -> copy existing `address` as `communicationaddress`  
                    false -> use the address fields provided below
                  example: true
                addresslineOne:
                  type: string
                  description: Required when `useExistingAddress = false`
                  example: "Flat 101, ABC Residency"
                addresslineTwo:
                  type: string
                  description: Optional second line of the communication address
                  example: "Near XYZ Temple"
                City:
                  type: string
                  description: Required when `useExistingAddress = false`
                  example: "Nellore"
                State:
                  type: string
                  description: Required when `useExistingAddress = false`
                  example: "Andhra Pradesh"
                pincode:
                  type: string
                  description: Required when `useExistingAddress = false`
                  example: "524003"
      responses:
        "200":
          description: Communication address updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: "Communication address updated successfully"
                  response:
                    type: object
                    properties:
                      details:
                        type: object
                        properties:
                          userid:
                            type: string
                            example: "804881"
                          isaadharverified:
                            type: boolean
                            example: true
                          isCommunicationaddressadded:
                            type: boolean
                            example: true
                          address:
                            type: object
                            description: Base / Aadhaar address of the user
                            additionalProperties: true
                          communicationaddress:
                            type: object
                            description: Communication address stored for the user
                            properties:
                              addresslineOne:
                                type: string
                                example: "Flat 101, ABC Residency"
                              addresslineTwo:
                                type: string
                                example: "Near XYZ Temple"
                              City:
                                type: string
                                example: "Nellore"
                              State:
                                type: string
                                example: "Andhra Pradesh"
                              pincode:
                                type: string
                                example: "524003"
              examples:
                success:
                  value:
                    statusCode: 200
                    message: "Communication address updated successfully"
                    response:
                      details:
                        userid: "804881"
                        isaadharverified: true
                        isCommunicationaddressadded: true
                        address:
                          addresslineOne: "H. No 434"
                          addresslineTwo: "Eagapallem"
                          City: "Nellore"
                          State: "Andhra Pradesh"
                          pincode: "524303"
                          mobilenumber: "9876543210"
                        communicationaddress:
                          addresslineOne: "Flat 101, ABC Residency"
                          addresslineTwo: "Near XYZ Temple"
                          City: "Nellore"
                          State: "Andhra Pradesh"
                          pincode: "524003"
        "400":
          description: Missing or invalid parameters
          content:
            application/json:
              oneOf:
                - description: Missing userid
                  schema:
                    type: object
                    properties:
                      statusCode:
                        type: integer
                        example: 400
                      message:
                        type: string
                        example: "userid is required in headers"
                      response:
                        type: object
                        example: { }
                - description: Missing useExistingAddress
                  schema:
                    type: object
                    properties:
                      statusCode:
                        type: integer
                        example: 400
                      message:
                        type: string
                        example: "useExistingAddress is required in request body (true/false)"
                      response:
                        type: object
                        example: { }
                - description: Missing address fields when useExistingAddress = false
                  schema:
                    type: object
                    properties:
                      statusCode:
                        type: integer
                        example: 400
                      message:
                        type: string
                        example: "addresslineOne, City, State and pincode are required for communication address"
                      response:
                        type: object
                        example: { }
                - description: Base address not found while useExistingAddress = true
                  schema:
                    type: object
                    properties:
                      statusCode:
                        type: integer
                        example: 400
                      message:
                        type: string
                        example: "Base address not found for this user"
                      response:
                        type: object
                        example: { }
        "401":
          description: Invalid userid
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 401
                  message:
                    type: string
                    example: "Invalid userid"
                  response:
                    type: object
                    example: { }
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 500
                  message:
                    type: string
                    example: "Internal server error"
                  response:
                    type: object
                    example: { }
