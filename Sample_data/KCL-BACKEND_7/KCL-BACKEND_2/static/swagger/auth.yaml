openapi: 3.0.3
info:
  title: AUTH API
  version: "1.0"
paths:
  /api/auth/refresh:
    post:
      tags:
        - Authentication
      summary: Refresh access and refresh tokens
      description: |
        Accepts a valid refresh token and returns a new access and refresh token pair.  
        Used to renew expired access tokens without re-login.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
                  description: "JWT refresh token (can also be sent via Authorization header)"
                  example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
      responses:
        "200":
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Token refreshed successfully
                  response:
                    type: object
                    properties:
                      access_token:
                        type: string
                        example: "new_access_token_here"
                      refresh_token:
                        type: string
                        example: "new_refresh_token_here"
                      session_id:
                        type: string
                        example: "S-12345"
                      userid:
                        type: string
                        example: "261309"
        "400":
          description: Refresh token missing
          content:
            application/json:
              schema:
                type: object
                example:
                  statusCode: 400
                  message: "Refresh token missing"
                  response: { }
        "401":
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                type: object
                example:
                  statusCode: 401
                  message: "Refresh failed: Token expired"
                  response: { }
        "500":
          description: Internal server error
