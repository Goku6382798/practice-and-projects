openapi: 3.0.3
info:
  title: AADHAR API
  version: "1.0"
paths:
  /api/aadhar_generate_otp:
    post:
      tags:
        - Aadhar
      summary: Generate Aadhar OTP
      description: Generates an OTP for Aadhar verification.
      security:
        - bearerAuth: [ ]
      parameters:
        - in: header
          name: user_id
          required: true
          schema:
            type: string
        - in: header
          name: languageCode
          required: false
          schema:
            type: string
          example: "en"
          description: "Language code for translated messages. Defaults to 'en'."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                aadhar_number:
                  type: string
              required:
                - aadhar_number
      responses:
        "200":
          description: OTP generated successfully
          content:
            application/json:
              examples:
                success:
                  summary: Successful OTP generation
                  value:
                    statusCode: 200
                    message: "OTP generated successfully."
                    response: { }
        "500":
          description: Internal Server Error
          content:
            application/json:
              examples:
                server_error:
                  summary: Server error
                  value:
                    statusCode: 500
                    message: "Internal server error"
                    response: { }


  /api/aadhar_verify_otp:
    post:
      tags:
        - Aadhar
      summary: Verify Aadhar OTP
      description: Verifies the Aadhar OTP and updates the user details.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                aadhar_number:
                  type: string
                aadhar_otp:
                  type: string
              required:
                - aadhar_number
                - aadhar_otp
      parameters:
        - in: header
          name: languageCode
          required: false
          schema:
            type: string
          example: "en"
          description: "Language code for translated messages. Defaults to 'en'."
        - in: header
          name: userId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Aadhar OTP verified successfully
          content:
            application/json:
              examples:
                example1:
                  summary: Success response
                  value:
                    statusCode: 200
                    message: "aadhar otp verified"
                    response:
                      details:
                        userid: "12345"
                        name: "Test Sample"
                        dob: "20/12/1999"
                        gender: "male"
                        user_type: false
                        isaadharverified: true
                        isCommunicationaddressadded: false
                        communicationaddress:
                          addresslineOne: ""
                          addresslineTwo: ""
                          City: ""
                          State: ""
                          pincode: ""
                          mobilenumber: ""
                        address:
                          addresslineOne: "456, block 10000, building 200000"
                          addresslineTwo: "xyz society,abc area"
                          City: "City 123"
                          State: "State 123"
                          pincode: "2345617"
                          mobilenumber: "98765421901"
                      ismpinsetup: false
                      isprofilesetup: false

        "500":
          description: Internal Server Error
          content:
            application/json:
              examples:
                server_error:
                  summary: Server error
                  value:
                    statusCode: 500
                    message: "Internal server error"
                    response: {}

  /api/aadhar_eligibility:
    post:
      tags:
        - Aadhar
      summary: Check Aadhar Eligibility
      description: Checks user eligibility based on age, gender, and pincode for a contest.
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: userId
          required: true
          schema:
            type: string
          description: "User ID for eligibility check"
        - in: header
          name: languageCode
          required: false
          schema:
            type: string
          example: "en"
          description: "Language code for translated messages. Defaults to 'en'."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                contest_id:
                  type: string
                  description: "Contest ID for which eligibility is being checked"
              required:
                - contest_id
      responses:
        "200":
          description: Eligibility checked successfully
          content:
            application/json:
              examples:
                eligible_user:
                  summary: Eligible user response
                  value:
                    statusCode: 200
                    message: "Eligibility checked successfully"
                    response:
                      name: "Test Sample"
                      isEligible: true
                      ageDetails:
                        age: "25 years"
                        isEligible: true
                        eligibility: ""
                      genderDetails:
                        gender: "Male"
                        isEligible: true
                        eligibility: ""
                      pincodeDetails:
                        pincode: "744301"
                        isEligible: true
                        eligibility: ""
                      errors: []
                ineligible_user:
                  summary: Ineligible user response
                  value:
                    statusCode: 200
                    message: "Eligibility checked successfully"
                    response:
                      name: "Test User"
                      isEligible: false
                      ageDetails:
                        age: "17 years"
                        isEligible: false
                        eligibility: "Age must be between 18 and 60 years"
                      genderDetails:
                        gender: "Male"
                        isEligible: true
                        eligibility: ""
                      pincodeDetails:
                        pincode: "400001"
                        isEligible: false
                        eligibility: "The Pincode does not lie in Rural India."
                      errors:
                        - "Age must be between 18 and 60 years"
                        - "The Pincode does not lie in Rural India."
        "400":
          description: Bad Request - Missing required fields
          content:
            application/json:
              examples:
                missing_fields:
                  summary: Missing required fields
                  value:
                    statusCode: 400
                    message: "Missing required fields"
                    response: {}
        "404":
          description: User not found
          content:
            application/json:
              examples:
                user_not_found:
                  summary: User not found
                  value:
                    statusCode: 404
                    message: "User not found"
                    response: {}
        "500":
          description: Internal Server Error
          content:
            application/json:
              examples:
                server_error:
                  summary: Server error
                  value:
                    statusCode: 500
                    message: "Internal server error"
                    response: {}
