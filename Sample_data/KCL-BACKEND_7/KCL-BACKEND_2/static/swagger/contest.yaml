openapi: 3.0.3
info:
  title: CONTEST API
  version: "1.0"

paths:
  /api/contest_this_season:
    post:
      tags:
        - Contest
      summary: Get a contest (current season, localized)
      description: |
        Returns contest payload for the given `contest_id`, localized by the `languageCode` header.

        Notes:
          • `userid` is OPTIONAL — the API must work even if userid is missing.
          • If userid is provided, user progress flags (`isaadharverified`, `isEligible`, etc.) are returned.
          • If userid is not provided, flags default to `false`.
          • If languageCode is invalid or missing, fallback is **en**.

      security: []   # no JWT

      parameters:
        - in: header
          name: languageCode
          required: true
          schema:
            type: string
            example: "en"
          description: Language code for contest localization.

        - in: header
          name: userid
          required: false        # <--------- CHANGED HERE
          schema:
            type: string
            example: "USER12345"
          description: |
            Optional User ID.
            If provided → user flags are returned.
            If missing → API still works normally (flags default to false).

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - contest_id
              properties:
                contest_id:
                  type: string
                  example: "1"
                mobile:
                  type: string
                  example: "+919876543210"

      responses:
        "200":
          description: Contest fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: success
                  response:
                    type: object
                    properties:
                      isaadharverified:
                        type: boolean
                        example: false
                        description: |
                          Returns user verification status IF userid is provided.
                          Defaults to false when userid is missing.
                      isEligible:
                        type: boolean
                        example: false
                      isCommunicationaddressadded:
                        type: boolean
                        example: false
                      isPaymentDone:
                        type: boolean
                        example: false
                      contestData:
                        type: array
                        items:
                          type: object
                          # ... (this section stays unchanged)

        "400":
          description: Missing or invalid parameters
          content:
            application/json:
              oneOf:
                - description: Missing language code
                  schema:
                    type: object
                    properties:
                      statusCode:
                        type: integer
                        example: 400
                      message:
                        type: string
                        example: "Language code is required in headers"
                      response:
                        type: object
                        example: { }

                - description: Missing contest_id
                  schema:
                    type: object
                    properties:
                      statusCode:
                        type: integer
                        example: 400
                      message:
                        type: string
                        example: "contest_id is required in request body"
                      response:
                        type: object
                        example: { }

                - description: Invalid contest_id
                  schema:
                    type: object
                    properties:
                      statusCode:
                        type: integer
                        example: 400
                      message:
                        type: string
                        example: "Invalid contest_id"
                      response:
                        type: object
                        example: { }

        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 500
                  message:
                    type: string
                    example: "Internal server error"
                  response:
                    type: object
                    example: { }
