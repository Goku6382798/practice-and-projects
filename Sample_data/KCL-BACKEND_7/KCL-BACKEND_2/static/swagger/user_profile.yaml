openapi: 3.0.3
info:
  title: USER PROFILE API
  version: "1.0"
paths:
  /api/user_profile:
    post:
      tags:
        - Profile
      summary: Create or Update User Profile
      description: |
        Creates a new user profile if none exists for the given **userId**,  
        or updates an existing one provided you have **profileid** or not have.  
        - `userId` is **required in headers**.  

      parameters:
      - name: languageCode
        in: header
        required: true
        schema:
          type: string
        example: "en"
        description: "Language code for translated messages. Defaults to 'en'."
      - name: userId
        in: header
        required: true
        schema:
          type: string
        example: "111193"
        description: "Unique userId identifying the logged-in user from user_master"
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                profileImage:
                  type: string
                  format: binary
                  description: "Profile image file to upload (optional)."
                name:
                  type: string
                  example: "John Doe"
                nickname:
                  type: string
                  example: "JD"
                userHandle:
                  type: string
                  example: "john@123"
                gender:
                  type: object
                  description: "Gender object (only code is stored)."
                  properties:
                    name:
                      type: string
                      example: "Male"
                    code:
                      type: string
                      example: "1"
                preferredLanguage:
                  type: object
                  description: "Language object (only code is stored)."
                  properties:
                    name:
                      type: string
                      example: "English"
                    code:
                      type: string
                      example: "en"
                interestWith:
                  type: array
                  description: "List of interest objects (only codes are stored)."
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                        example: "Bowling"
                      code:
                        type: string
                        example: "2"
                profileid:
                  type: string
                  example: "e3bf358f-c75c-493c-b779-e9615edf058d"
          application/json:
            schema:
              type: object
              properties:
                profileImage:
                  type: string
                  example: "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAA..."
                name:
                  type: string
                  example: "John Doe"
                nickname:
                  type: string
                  example: "JD"
                userHandle:
                  type: string
                  example: "john@123"
                gender:
                  type: object
                  description: "Gender object (only code is stored)."
                  properties:
                    name:
                      type: string
                      example: "Male"
                    code:
                      type: string
                      example: "1"
                preferredLanguage:
                  type: object
                  description: "Language object (only code is stored)."
                  properties:
                    name:
                      type: string
                      example: "English"
                    code:
                      type: string
                      example: "en"
                interestWith:
                  type: array
                  description: "List of interest objects (only codes are stored)."
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                        example: "Bowling"
                      code:
                        type: string
                        example: "2"
                profileid:
                  type: string
                  example: "e3bf358f-c75c-493c-b779-e9615edf058d"
      responses:
        "200":
          description: Profile created or updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: "Profile created successfully"
                  response:
                    type: object
                    properties:
                      details:
                        type: object
                        properties:
                          profileid:
                            type: string
                            example: "e3bf358f-c75c-493c-b779-e9615edf058d"
                          userid:
                            type: string
                            example: "111193"
                          profileimage:
                            type: string
                            example: "https://bucket.s3.region.amazonaws.com/Users_images/john.png"
                          name:
                            type: string
                            example: "John Doe"
                          nickname:
                            type: string
                            example: "JD"
                          userHandle:
                            type: string
                            example: "john@123"
                          gender:
                            type: object
                            properties:
                              name:
                                type: string
                                example: "Male"
                              code:
                                type: string
                                example: "1"
                          preferredLanguage:
                            type: object
                            properties:
                              name:
                                type: string
                                example: "English"
                              code:
                                type: string
                                example: "en"
                          interestWith:
                            type: array
                            items:
                              type: object
                              properties:
                                name:
                                  type: string
                                  example: "Bowling"
                                code:
                                  type: string
                                  example: "2"
                          mobile:
                            type: string
                            example: "+919876543210"
                          mail:
                            type: string
                            example: "john@example.com"
                      isprofilesetup:
                        type: boolean
                        example: true
                      ismpinsetup:
                        type: boolean
                        example: true
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 500
                  message:
                    type: string
                    example: "Internal server error"
                  response:
                    type: object
                    example: { }

  /api/user_handle:
    post:
      tags:
        - Profile
      summary: Check user handle availability
      description: |
        Checks whether a given **userHandle** is already registered in `user_master`.
  
        - If **userHandle is not provided or empty** → treated as available  
        - If **userHandle does NOT exist** in DB → returns **200** with message *"user handle is available"*  
        - If **userHandle already exists** in DB → returns **400** with message  
          *"User handle already exists, please choose another one"*
  
        JWT is optional for this endpoint.
      security: [ ]   # JWT optional
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                userHandle:
                  type: string
                  example: "john@123"
                  description: "Optional user handle to check for availability."
      responses:
        "200":
          description: User handle is available (either not provided or not found in DB)
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: "user handle is available"
                  response:
                    type: object
                    example: { }
        "400":
          description: User handle already exists
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 400
                  message:
                    type: string
                    example: "User handle already exists, please choose another one"
                  response:
                    type: object
                    example: { }
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 500
                  message:
                    type: string
                    example: "Internal server error"
                  response:
                    type: object
                    example: { }


