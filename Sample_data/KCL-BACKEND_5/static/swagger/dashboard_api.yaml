openapi: 3.0.3
info:
  title: DASHBOARD APIs
  version: "1.0"
paths:
  /api/dashboard_images:
    post:
      tags:
        - Dashboard
      summary: Get dashboard images and sections
      description: |
        Returns all dashboard sections such as banners, contests, teams, top contestants, episodes, and training videos.
        Each section is fetched from MongoDB and localized using `languageCode` in headers.
        JWT authentication is optional.
      security: [ ]  # JWT optional
      parameters:
        - in: header
          name: languageCode
          required: true
          schema:
            type: string
            example: "en"
          description: Language code to localize content (e.g., en, hi, te)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                mobile:
                  type: string
                  example: "+919876543210"
      responses:
        "200":
          description: Dashboard sections fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Success
                  response:
                    type: array
                    items:
                      type: object
                      properties:
                        index:
                          type: integer
                          example: 1
                        type:
                          type: string
                          example: bannersList
                        bannersList:
                          type: array
                          items:
                            type: object
                            properties:
                              id: { type: integer, example: 1 }
                              image: { type: string, example: "https://s3.../banner1.png" }
                              description: { type: string, example: "Welcome Banner" }
        "400":
          description: Missing or invalid language code
          content:
            application/json:
              example:
                statusCode: 400
                message: "Language code is required in headers"
                response: { }
        "500":
          description: Internal server error
          content:
            application/json:
              example:
                statusCode: 500
                message: "Internal server error"
                response: { }

  /api/dashboard_more_option:
    post:
      tags:
        - Dashboard
      summary: Get additional contest sections
      description: |
        Returns additional contest sections such as "Live Contests" and "Upcoming Contests".
        Each contest includes localized name, image, and date.
        JWT authentication is optional.
      security: [ ]  # JWT optional
      parameters:
        - in: header
          name: languageCode
          required: true
          schema:
            type: string
            example: "en"
          description: Language code for localization.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                mobile:
                  type: string
                  example: "+919876543210"
      responses:
        "200":
          description: Contest more options fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Success
                  response:
                    type: array
                    items:
                      type: object
                      properties:
                        title:
                          type: string
                          example: "Live Contests"
                        visible:
                          type: boolean
                          example: true
                        data:
                          type: array
                          items:
                            type: object
                            properties:
                              id: { type: string, example: "1" }
                              image: { type: string, example: "https://.../live1.png" }
                              date: { type: string, example: "2nd Sep 2025" }
                              description: { type: string, example: "Batting Contest" }
        "400":
          description: Missing or invalid language code
          content:
            application/json:
              example:
                statusCode: 400
                message: "Language code is required in headers"
                response: { }
        "500":
          description: Internal server error
          content:
            application/json:
              example:
                statusCode: 500
                message: "Internal server error"
                response: { }
