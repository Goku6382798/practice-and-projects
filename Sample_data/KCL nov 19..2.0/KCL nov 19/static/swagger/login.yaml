openapi: 3.0.3
info:
  title: LOGIN APIs
  version: "1.0"
paths:

  /api/generate_otp:
    post:
      tags:
        - OTP
      summary: Generate OTP for login (mobile or mail)
      description: |
        Generates an OTP based on login type (mobile or mail).  
        - **login_type = 1** → Mobile Login  
        - **login_type = 2** → Mail Login  
        Returns OTP sent success response or user details if already registered.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                login_type:
                  type: string
                  enum: ["1", "2"]
                  description: "1 for mobile login, 2 for mail login"
                mobile:
                  type: string
                  example: "+919876543210"
                mail:
                  type: string
                  example: "features@example.com"
              required:
                - login_type
      responses:
        "200":
          description: OTP sent or user details retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: OTP sent successfully
                  response:
                    type: object
                    properties:
                      details:
                        type: object
                        properties:
                          user_id:
                            type: string
                            example: "12345"
                          user_type:
                            type: string
                            example: "1"
                          name:
                            type: string
                            example: "Test Sample"
                          mobile:
                            type: string
                            example: "+919876543210"
                          mail:
                            type: string
                            example: "features@example.com"
                          dob:
                            type: string
                            example: "05/05/2025"
                          address:
                            type: string
                            example: "123 society name, city, pincode"
                      ismpinsetup:
                        type: boolean
                        example: false
                      isprofilesetup:
                        type: boolean
                        example: false
        "400":
          description: Invalid input (missing or incorrect parameters)
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 400
                  message:
                    type: string
                    example: Invalid mobile number format
                  response:
                    type: object
                    example: {}
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 500
                  message:
                    type: string
                    example: Internal server error
                  response:
                    type: object
                    example: {}

  /api/verify_otp:
    post:
      tags:
        - OTP
      summary: Verify OTP for login (mobile or mail)
      description: |
        Verifies OTP for a user based on login type.
        - **login_type = 1** → Mobile Login  
        - **login_type = 2** → Mail Login  
        Returns access token, setup flags, and user details (if available).  
        If user profile is not yet set up, returns default empty profile structure.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                login_type:
                  type: string
                  enum: ["1", "2"]
                  description: "1 for mobile login, 2 for mail login"
                mobile:
                  type: string
                  example: "+919876543210"
                  description: "Required if login_type = 1"
                mail:
                  type: string
                  example: "abc@domain.com"
                  description: "Required if login_type = 2"
                otp:
                  type: string
                  example: "1234"
                  description: "OTP sent to mobile or mail"
              required:
                - login_type
                - otp
      responses:
        "200":
          description: OTP verified successfully
          content:
            application/json:
              examples:
                Profile_Setup:
                  summary: User has completed profile setup
                  value:
                    statusCode: 200
                    message: "OTP verified successfully"
                    response:
                      details:
                        userid: "804881"
                        profileid: "d68a1725-ab39-469e-af79-1d1cf7df68ed"
                        name: "John Doe"
                        nickname: "Johnny"
                        userHandle: "@john123"
                        image: "https://bucket.s3.amazonaws.com/profile/john123.png"
                        gender:
                          code: "1"
                          name: "Male"
                        interestWith:
                          - code: "1"
                            name: "Movies"
                          - code: "2"
                            name: "Sports"
                        preferredLanguage:
                          code: "en"
                          native: "English"
                      access_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                      ismpinsetup: true
                      isprofilesetup: true
                Profile_Not_Setup:
                  summary: User has not completed profile setup yet
                  value:
                    statusCode: 200
                    message: "OTP verified successfully"
                    response:
                      details:
                        userid: "804881"
                        profileid: ""
                        name: ""
                        nickname: ""
                        userHandle: ""
                        image: ""
                        gender:
                          code: ""
                          name: ""
                        interestWith: []
                        preferredLanguage:
                          code: ""
                          native: ""
                      access_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                      ismpinsetup: false
                      isprofilesetup: false
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: "OTP verified successfully"
                  response:
                    type: object
                    properties:
                      details:
                        type: object
                        properties:
                          userid:
                            type: string
                          profileid:
                            type: string
                          name:
                            type: string
                          nickname:
                            type: string
                          userHandle:
                            type: string
                          image:
                            type: string
                          gender:
                            type: object
                            properties:
                              code:
                                type: string
                              name:
                                type: string
                          interestWith:
                            type: array
                            items:
                              type: object
                              properties:
                                code:
                                  type: string
                                name:
                                  type: string
                          preferredLanguage:
                            type: object
                            properties:
                              code:
                                type: string
                              native:
                                type: string
                      access_token:
                        type: string
                      ismpinsetup:
                        type: boolean
                      isprofilesetup:
                        type: boolean
        "400":
          description: Missing or invalid parameters
          content:
            application/json:
              schema:
                type: object
                example:
                  statusCode: 400
                  message: "OTP is required"
                  response: {}
        "401":
          description: Invalid OTP or credentials
          content:
            application/json:
              schema:
                type: object
                example:
                  statusCode: 401
                  message: "Invalid mobile or OTP"
                  response: {}
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                example:
                  statusCode: 500
                  message: "Internal server error"
                  response: {}


# ------------------------------
# MPIN APIs
# ------------------------------
  /api/create_mpin:
    post:
      summary: Create MPIN
      description: Creates a 4-digit MPIN for the authenticated user. JWT authentication is required.
      tags:
        - MPIN
      security:
        - bearerAuth: []    # JWT required
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - login_type
                - mpin
              properties:
                login_type:
                  type: string
                  description: "1 for mobile, 2 for mail"
                  example: "1"
                mobile:
                  type: string
                  example: "+919876543210"
                mail:
                  type: string
                  example: "abc@domain.com"
                mpin:
                  type: string
                  description: "4-digit MPIN"
                  example: "1234"
      responses:
        "200":
          description: MPIN created successfully
        "400":
          description: Missing fields or invalid MPIN
        "409":
          description: MPIN already exists
        "500":
          description: Internal server error

  /api/mpin_generate_otp:
    post:
      summary: Generate OTP for MPIN setup
      description: |
        Generates an OTP for MPIN creation or recovery based on the login type.  
        - **login_type = 1** → Mobile OTP  
        - **login_type = 2** → Mail OTP  
        JWT authentication is not required.
      tags:
        - MPIN
      security: [ ]    # JWT not required
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - login_type
              properties:
                login_type:
                  type: string
                  description: "1 for mobile, 2 for mail"
                  enum: [ "1", "2" ]
                  example: "1"
                mobile:
                  type: string
                  description: "User mobile number (required if login_type = 1)"
                  example: "+919876543210"
                mail:
                  type: string
                  description: "User email address (required if login_type = 2)"
                  example: "abc@domain.com"
      responses:
        "200":
          description: OTP generated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: OTP generated successfully on mobile
                  response:
                    type: object
                    example: { }
        "400":
          description: Missing or invalid input
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 400
                  message:
                    type: string
                    example: All fields are required
                  response:
                    type: object
                    example: { }
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 500
                  message:
                    type: string
                    example: Internal server error
                  response:
                    type: object
                    example: { }

  /api/verify_mpin:
    post:
      tags:
        - MPIN
      summary: Verify MPIN for login (mobile or mail)
      description: |
        Verifies a user's MPIN based on their login type.
        - **login_type = 1** → Mobile Login  
        - **login_type = 2** → Mail Login  
        Returns user details (if profile is set up) and access token.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                login_type:
                  type: string
                  enum: ["1", "2"]
                  description: "1 for mobile login, 2 for mail login"
                mobile:
                  type: string
                  example: "+919876543210"
                  description: "Required if login_type = 1"
                mail:
                  type: string
                  example: "user@example.com"
                  description: "Required if login_type = 2"
                mpin:
                  type: string
                  example: "1234"
                  description: "User's 4-digit MPIN"
              required:
                - login_type
                - mpin
#      parameters:
#        - name: access_token
#          in: header
#          description: Optional JWT token. If not provided, a new one is created.
#          required: false
#          schema:
#            type: string
#            example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
      responses:
        "200":
          description: MPIN verified successfully
          content:
            application/json:
              examples:
                Profile_Setup:
                  summary: User has completed profile setup
                  value:
                    statusCode: 200
                    message: "MPIN verified successfully"
                    response:
                      details:
                        userid: "804881"
                        profileid: "d68a1725-ab39-469e-af79-1d1cf7df68ed"
                        name: "John Doe"
                        nickname: "Johnny"
                        userHandle: "@john123"
                        image: "https://bucket.s3.amazonaws.com/profile/john123.png"
                        gender:
                          code: "1"
                          name: "Male"
                        interestWith:
                          - code: "1"
                            name: "Movies"
                          - code: "2"
                            name: "Sports"
                        preferredLanguage:
                          code: "en"
                          native: "English"
                        user_type: "regular"
                      access_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                      ismpinsetup: true
                      isprofilesetup: true
                Profile_Not_Setup:
                  summary: User has not completed profile setup yet
                  value:
                    statusCode: 200
                    message: "MPIN verified successfully"
                    response:
                      details:
                        userid: "804881"
                        profileid: ""
                        name: ""
                        nickname: ""
                        userHandle: ""
                        image: ""
                        gender:
                          code: ""
                          name: ""
                        interestWith:
                          - code: ""
                            name: ""
                          - code: ""
                            name: ""
                        preferredLanguage:
                          code: ""
                          native: ""
                      access_token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                      ismpinsetup: false
                      isprofilesetup: false
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: "MPIN verified successfully"
                  response:
                    type: object
                    properties:
                      details:
                        type: object
                        properties:
                          userid:
                            type: string
                          profileid:
                            type: string
                          name:
                            type: string
                          nickname:
                            type: string
                          userHandle:
                            type: string
                          image:
                            type: string
                          gender:
                            type: object
                            properties:
                              code:
                                type: string
                              name:
                                type: string
                          interestWith:
                            type: array
                            items:
                              type: object
                              properties:
                                code:
                                  type: string
                                name:
                                  type: string
                          preferredLanguage:
                            type: object
                            properties:
                              code:
                                type: string
                              native:
                                type: string
                          user_type:
                            type: string
                            example: "regular"
                      access_token:
                        type: string
                      ismpinsetup:
                        type: boolean
                      isprofilesetup:
                        type: boolean
        "400":
          description: Missing or invalid parameters
          content:
            application/json:
              schema:
                type: object
                example:
                  statusCode: 400
                  message: "All fields are required"
                  response: {}
        "401":
          description: MPIN verification failed (invalid or incorrect)
          content:
            application/json:
              schema:
                type: object
                example:
                  statusCode: 401
                  message: "MPIN verification failed"
                  response: {}
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                example:
                  statusCode: 500
                  message: "Internal server error"
                  response: {}


  /api/mpin_verify_otp:
    post:
      summary: Verify OTP for MPIN setup
      description: Verifies OTP for MPIN setup or recovery. JWT authentication is required.
      tags:
        - MPIN
      security:
        - bearerAuth: []    # JWT required
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - login_type
                - otp
              properties:
                login_type:
                  type: string
                  description: "1 for mobile, 2 for mail"
                  example: "1"
                mobile:
                  type: string
                  example: "+919876543210"
                mail:
                  type: string
                  example: "abc@domain.com"
                otp:
                  type: string
                  example: "1234"
      responses:
        "200":
          description: OTP verified successfully
        "400":
          description: Invalid request or missing parameters
        "401":
          description: Invalid OTP or unauthorized
        "500":
          description: Internal server error

  /api/regenerate_mpin:
    post:
      summary: Regenerate MPIN
      description: Allows an authenticated user to reset their MPIN. JWT authentication is required.
      tags:
        - MPIN
      security:
        - bearerAuth: []    # JWT required
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - login_type
                - mpin
              properties:
                login_type:
                  type: string
                  description: "1 for mobile, 2 for mail"
                  example: "1"
                mobile:
                  type: string
                  example: "+919876543210"
                mail:
                  type: string
                  example: "abc@domain.com"
                mpin:
                  type: string
                  description: "New 4-digit MPIN"
                  example: "4321"
      responses:
        "200":
          description: MPIN regenerated successfully
        "400":
          description: Invalid MPIN or missing fields
        "401":
          description: Unauthorized or failed to regenerate MPIN
        "500":
          description: Internal server error
