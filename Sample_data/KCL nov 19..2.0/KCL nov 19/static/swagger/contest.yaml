openapi: 3.0.3
info:
  title: CONTEST API
  version: "1.0"
paths:
  /api/contest_this_season:
    post:
      tags:
        - Contest
      summary: Get a contest (current season, localized)
      description: |
        Returns a single contest payload for the given `contest_id`, localized by the `languageCode` header.
        If the provided language code is not found in `language_master`, the API falls back to **en**.
        Also returns user-specific flags (isaadharverified, isEligible, isCommunicationaddressadded, isPaymentDone)
        based on MongoDB collections `user_master` and `user_contest_mapping`, filtered by the `userid` header.
      security: [ ]   # JWT not required for this endpoint
      parameters:
        - in: header
          name: languageCode
          required: true
          schema:
            type: string
            example: "en"
          description: Language code to localize contest strings (e.g., en, hi, te).
        - in: header
          name: userid
          required: true
          schema:
            type: string
            example: "12345"
          description: User ID used to fetch flags from user_master and user_contest_mapping.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ contest_id ]
              properties:
                contest_id:
                  type: string
                  description: Contest ID (can be stored as string or number in DB, handled internally).
                  example: "1"
                mobile:
                  type: string
                  example: "+919876543210"
      responses:
        "200":
          description: Contest fetched successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: success
                  response:
                    type: object
                    properties:
                      isaadharverified:
                        description: Flag from user_master.isaadharverified ("" if not found).
                        nullable: true
                        oneOf:
                          - type: string
                          - type: boolean
                        example: true
                      isEligible:
                        description: Flag from user_contest_mapping.isEligible ("" if not found).
                        nullable: true
                        oneOf:
                          - type: string
                          - type: boolean
                        example: true
                      isCommunicationaddressadded:
                        description: Flag from user_master.isCommunicationaddressadded ("" if not found).
                        nullable: true
                        oneOf:
                          - type: string
                          - type: boolean
                        example: true
                      isPaymentDone:
                        description: Flag from user_contest_mapping.isPaymentDone ("" if not found).
                        nullable: true
                        oneOf:
                          - type: string
                          - type: boolean
                        example: true
                      contestData:
                        type: array
                        items:
                          type: object
                          properties:
                            contest_id:
                              oneOf:
                                - type: string
                                - type: integer
                              example: "1"
                            bannersList:
                              type: array
                              description: List of banner items.
                              items:
                                type: object
                                properties:
                                  type:
                                    type: string
                                    example: "image"
                                  source:
                                    type: string
                                    example: "https://s3.../banner1.png"
                                  thumbnail:
                                    nullable: true
                                    oneOf:
                                      - type: string
                                      - type: "null"
                            contest:
                              type: string
                              description: Localized contest name.
                              example: "Batsman Contest"
                            dates:
                              type: object
                              properties:
                                startDate:
                                  type: string
                                  example: "2nd Sep 2025"
                                endDate:
                                  type: string
                                  example: "2nd Oct 2025"
                            benefitsList:
                              type: array
                              items:
                                type: object
                                properties:
                                  id:
                                    type: integer
                                    example: 1
                                  image:
                                    type: string
                                    example: "https://s3.../benefit1.png"
                                  title:
                                    type: string
                                    example: "Earn a spot in KCL League"
                            eligibleCriteriaList:
                              type: array
                              items:
                                type: object
                                properties:
                                  id:
                                    type: integer
                                    example: 1
                                  image:
                                    type: string
                                    example: "https://s3.../criteria1.png"
                                  title:
                                    type: string
                                    example: "Age 16+ only"
                            selectionProcessList:
                              type: array
                              items:
                                type: object
                                properties:
                                  id:
                                    type: integer
                                    example: 1
                                  image:
                                    type: string
                                    example: "https://s3.../selection1.png"
                                  title:
                                    type: string
                                    example: "Screening round"
                            contestFee:
                              type: object
                              properties:
                                isLimitedOfferTime:
                                  type: boolean
                                  example: true
                                actualPrice:
                                  type: string
                                  example: "499"
                                afterDiscountPrice:
                                  type: string
                                  example: "299"
                                title:
                                  type: string
                                  example: "Contest Fee"
                                validateDate:
                                  type: string
                                  example: "Valid till 10 Oct 2025"
                            howToParticipate:
                              type: object
                              additionalProperties: true
                              description: Arbitrary key/value steps as stored in DB.
              examples:
                success:
                  value:
                    statusCode: 200
                    message: success
                    response:
                      isaadharverified: true
                      isEligible: true
                      isCommunicationaddressadded: true
                      isPaymentDone: true
                      contestData:
                        - contest_id: "1"
                          bannersList:
                            - type: "image"
                              source: "https://s3.../banner1.png"
                              thumbnail: null
                          contest: "Batsman Contest"
                          dates:
                            startDate: "2nd Sep 2025"
                            endDate: "2nd Oct 2025"
                          benefitsList:
                            - id: 1
                              image: "https://s3.../benefit1.png"
                              title: "Earn a spot in KCL League"
                          eligibleCriteriaList:
                            - id: 1
                              image: "https://s3.../criteria1.png"
                              title: "Age 16+ only"
                          selectionProcessList:
                            - id: 1
                              image: "https://s3.../selection1.png"
                              title: "Screening round"
                          contestFee:
                            isLimitedOfferTime: true
                            actualPrice: "499"
                            afterDiscountPrice: "299"
                            title: "Contest Fee"
                            validateDate: "Valid till 10 Oct 2025"
                          howToParticipate:
                            step1: "Register on the app"
                            step2: "Upload practice video"
        "400":
          description: Missing or invalid parameters
          content:
            application/json:
              oneOf:
                - description: Missing language code
                  schema:
                    type: object
                    properties:
                      statusCode:
                        type: integer
                        example: 400
                      message:
                        type: string
                        example: "Language code is required in headers"
                      response:
                        type: object
                        example: { }
                - description: Missing userid
                  schema:
                    type: object
                    properties:
                      statusCode:
                        type: integer
                        example: 400
                      message:
                        type: string
                        example: "user_id is required in headers"
                      response:
                        type: object
                        example: { }
                - description: Missing contest_id
                  schema:
                    type: object
                    properties:
                      statusCode:
                        type: integer
                        example: 400
                      message:
                        type: string
                        example: "contest_id is required in request body"
                      response:
                        type: object
                        example: { }
                - description: Invalid contest_id
                  schema:
                    type: object
                    properties:
                      statusCode:
                        type: integer
                        example: 400
                      message:
                        type: string
                        example: "Invalid contest_id"
                      response:
                        type: object
                        example: { }
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 500
                  message:
                    type: string
                    example: "Internal server error"
                  response:
                    type: object
                    example: { }
