openapi: 3.0.3
info:
  title: Communication Address API
  version: "1.0"
  description: |
    API to set the user's communication address in `user_master.communication_address`.

    - If `use_same_address = true`, it copies existing `address` from `user_master` into `communication_address`.
    - If `use_same_address = false`, it takes the address fields from the request body and saves them as `communication_address`.

paths:
  /api/user/communication_address:
    post:
      tags:
        - User
      summary: Set or copy communication address for a user
      description: |
        Sets the user's communication address in `user_master`.

        **Behaviour:**
        - If `use_same_address = true`, the API looks up the `address` field in `user_master` for the given `userid`
          and copies it into `communication_address`. It also sets `isCommunicationaddressadded = true`.
        - If `use_same_address = false`, the API expects full address fields in the request body and stores them
          into `communication_address`. It also sets `isCommunicationaddressadded = true`.
      security: [ ]   # No JWT required for this endpoint (no @jwt_required in communication.py)
      parameters:
        - in: header
          name: userid
          required: true
          schema:
            type: string
            example: "12345"
          description: User ID used to fetch the document from `user_master`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - use_same_address
              properties:
                use_same_address:
                  type: boolean
                  description: |
                    - `true` → Use existing `address` from `user_master` as `communication_address`.
                    - `false` → Take address fields from body and save as `communication_address`.
                  example: true
                address_line1:
                  type: string
                  description: Required when `use_same_address = false`.
                  example: "123, MG Road"
                address_line2:
                  type: string
                  description: Required when `use_same_address = false` (can be an empty string).
                  example: "Near City Mall"
                city:
                  type: string
                  description: Required when `use_same_address = false`.
                  example: "Bengaluru"
                state:
                  type: string
                  description: Required when `use_same_address = false`.
                  example: "Karnataka"
                pincode:
                  type: string
                  description: Required when `use_same_address = false`.
                  example: "560001"
            examples:
              use_existing_address:
                summary: Use permanent address as communication address
                value:
                  use_same_address: true
              new_communication_address:
                summary: Provide a new communication address
                value:
                  use_same_address: false
                  address_line1: "123, MG Road"
                  address_line2: "Near City Mall"
                  city: "Bengaluru"
                  state: "Karnataka"
                  pincode: "560001"
      responses:
        "200":
          description: Communication address saved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  message:
                    type: string
                    description: Success message from the API.
                    example: "New communication address saved"
                  response:
                    type: object
                    description: The final communication address stored in `user_master.communication_address`.
                    properties:
                      address_line1:
                        type: string
                        example: "123, MG Road"
                      address_line2:
                        type: string
                        example: "Near City Mall"
                      city:
                        type: string
                        example: "Bengaluru"
                      state:
                        type: string
                        example: "Karnataka"
                      pincode:
                        type: string
                        example: "560001"
              examples:
                from_permanent_address:
                  summary: Communication address copied from existing `address`
                  value:
                    statusCode: 200
                    message: "Communication address set to permanent address"
                    response:
                      address_line1: "456, Residency Road"
                      address_line2: "Opposite Park"
                      city: "Bengaluru"
                      state: "Karnataka"
                      pincode: "560002"
                new_address_saved:
                  summary: New communication address saved from request body
                  value:
                    statusCode: 200
                    message: "New communication address saved"
                    response:
                      address_line1: "123, MG Road"
                      address_line2: "Near City Mall"
                      city: "Bengaluru"
                      state: "Karnataka"
                      pincode: "560001"
        "400":
          description: Missing or invalid parameters
          content:
            application/json:
              oneOf:
                - description: Missing userid header
                  schema:
                    type: object
                    properties:
                      statusCode:
                        type: integer
                        example: 400
                      message:
                        type: string
                        example: "userid is required in headers"
                      response:
                        type: object
                        example: { }
                - description: Missing use_same_address field
                  schema:
                    type: object
                    properties:
                      statusCode:
                        type: integer
                        example: 400
                      message:
                        type: string
                        example: "use_same_address is required in body"
                      response:
                        type: object
                        example: { }
                - description: Invalid userid (user not found)
                  schema:
                    type: object
                    properties:
                      statusCode:
                        type: integer
                        example: 400
                      message:
                        type: string
                        example: "Invalid userid"
                      response:
                        type: object
                        example: { }
                - description: Permanent address not found when use_same_address = true
                  schema:
                    type: object
                    properties:
                      statusCode:
                        type: integer
                        example: 400
                      message:
                        type: string
                        example: "User permanent address not found"
                      response:
                        type: object
                        example: { }
                - description: Missing required address fields when use_same_address = false
                  schema:
                    type: object
                    properties:
                      statusCode:
                        type: integer
                        example: 400
                      message:
                        type: string
                        example: "Missing fields: address_line1, address_line2, city, state, pincode"
                      response:
                        type: object
                        example: { }
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 500
                  message:
                    type: string
                    example: "Internal server error"
                  response:
                    type: object
                    example: { }

components: {}
