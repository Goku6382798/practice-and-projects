openapi: 3.0.3
info:
  title: VIDEO UPLOAD API
  version: "1.0"

paths:
  /api/videos/upload:
    post:
      tags:
        - Video
      summary: Upload a video and generate HLS chunks
      description: |
        Accepts a video file from the frontend as `multipart/form-data`, uploads the original
        file to S3, generates HLS output with ~4 second segments using FFmpeg, uploads all HLS
        artifacts (master.m3u8 + .ts segments) and thumbnail to S3 / CloudFront, and stores
        a normalized document in MongoDB with the following structure:
        
        ```json
        {
          "_id": ObjectId("..."),
          "videoId": "abc123",
          "status": "ready",
          "original": {
            "s3_key": "originals/abc123.mp4",
            "url": "https://cdn/originals/abc123.mp4",
            "height": 1080,
            "width": 1920,
            "duration_sec": 312
          },
          "playback": {
            "master_url": "https://cdn/hls/abc123/master.m3u8",
            "poster_url": "https://cdn/thumbnails/abc123.jpg",
            "qualities": [1080, 720, 480, 360]
          },
          "error": {
            "message": null,
            "step": null
          },
          "created_by": "admin",
          "created_at": "2025-11-24T06:00:00Z",
          "updated_at": "2025-11-24T06:10:00Z"
        }
        ```
      security: [ ]   # JWT not required for this endpoint (adjust if needed)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: Video file to be uploaded and processed.
                created_by:
                  type: string
                  description: Optional identifier of the user/admin creating the video.
                  example: "admin"
      responses:
        "200":
          description: Video uploaded and processed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: "Video uploaded and processed successfully"
                  response:
                    type: object
                    properties:
                      videoId:
                        type: string
                        description: Stable unique video key (UUID/string).
                        example: "abc12345ef6789"
                      status:
                        type: string
                        description: Processing state.
                        example: "ready"
                        enum: [queued, processing, ready, failed]
                      original:
                        type: object
                        properties:
                          s3_key:
                            type: string
                            example: "originals/abc12345ef6789.mp4"
                          url:
                            type: string
                            example: "https://cdn.kclvideos.com/originals/abc12345ef6789.mp4"
                          height:
                            type: integer
                            nullable: true
                            example: 1080
                          width:
                            type: integer
                            nullable: true
                            example: 1920
                          duration_sec:
                            type: number
                            format: float
                            nullable: true
                            example: 312.45
                      playback:
                        type: object
                        properties:
                          master_url:
                            type: string
                            description: HLS master playlist URL (CloudFront/CDN).
                            example: "https://cdn.kclvideos.com/hls/abc12345ef6789/master.m3u8"
                          poster_url:
                            type: string
                            description: Thumbnail/poster URL for UI.
                            example: "https://cdn.kclvideos.com/thumbnails/abc12345ef6789.jpg"
                          qualities:
                            type: array
                            description: List of available vertical resolutions.
                            items:
                              type: integer
                            example: [1080, 720, 480, 360]
                      error:
                        type: object
                        properties:
                          message:
                            type: string
                            nullable: true
                            example: null
                          step:
                            type: string
                            nullable: true
                            example: null
                      created_by:
                        type: string
                        example: "admin"
                      created_at:
                        type: string
                        format: date-time
                        example: "2025-11-24T06:00:00Z"
                      updated_at:
                        type: string
                        format: date-time
                        example: "2025-11-24T06:10:00Z"
              examples:
                success:
                  value:
                    statusCode: 200
                    message: "Video uploaded and processed successfully"
                    response:
                      videoId: "abc12345ef6789"
                      status: "ready"
                      original:
                        s3_key: "originals/abc12345ef6789.mp4"
                        url: "https://cdn.kclvideos.com/originals/abc12345ef6789.mp4"
                        height: 1080
                        width: 1920
                        duration_sec: 312.45
                      playback:
                        master_url: "https://cdn.kclvideos.com/hls/abc12345ef6789/master.m3u8"
                        poster_url: "https://cdn.kclvideos.com/thumbnails/abc12345ef6789.jpg"
                        qualities: [1080, 720, 480, 360]
                      error:
                        message: null
                        step: null
                      created_by: "admin"
                      created_at: "2025-11-24T06:00:00Z"
                      updated_at: "2025-11-24T06:10:00Z"
        "400":
          description: Missing or invalid parameters (e.g., file not provided)
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 400
                  message:
                    type: string
                    example: "No file provided. Use form-data with key 'file'."
                  response:
                    type: object
                    example: { }
        "500":
          description: Internal server error during upload or processing
          content:
            application/json:
              schema:
                type: object
                properties:
                  statusCode:
                    type: integer
                    example: 500
                  message:
                    type: string
                    example: "Failed to upload/process video"
                  response:
                    type: object
                    properties:
                      error:
                        type: string
                        example: "encode_hls failed: ffmpeg error ..."
